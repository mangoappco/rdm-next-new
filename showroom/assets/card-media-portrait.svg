<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320"
     role="img" aria-label="Media vertical">
  <!--
    Asset de imagen del showroom, proporcion vertical, 3:4.

    DONDE SE USA
    ===========
    En el par de Ratio de `card.template.html`, cada uno en la ranura de su
    misma proporcion, y tambien en el par de Clase base el de landscape.

    LO QUE ESO CAMBIO
    =================
    Se perdio una demostracion, y esta aqui escrita para que se sepa.

    Con el asset generico, la ranura cuadrada recibia una imagen 16:9 y el
    `object-fit: contain` dejaba bandas de 70px arriba y abajo, y la vertical
    de 124px. Se veia que la caja la reserva la RANURA y no la imagen, y que el
    fondo de `surface-container-high` aparece en lo que sobra.

    Ahora el `viewBox` de este fichero coincide con el de su ranura, el
    `contain` lo deja a tamano exacto y no aparece ninguna banda. Queda
    bonito, y el par ya no ensena de donde sale el fondo de respaldo.

    Que es un intercambio, no una mejora. Para recuperar la demostracion hay
    que devolver `card-media.svg` a las tres ranuras del par de Ratio: es el
    unico sitio donde el desajuste se ve.

    RAYAS DE PUNTOS, Y NUNCA DOS GUIONES SEGUIDOS
    ============================================
    Este comentario es XML, y dos guiones seguidos lo vuelven invalido: el
    navegador tira el fichero entero sin avisar y naturalWidth queda a 0. Ya
    paso dos veces en el fichero hermano. Por eso los separadores de titulo
    son de puntos, y por eso aqui no se escribe ningun token del sistema,
    cuyo prefijo empieza por dos guiones.

    SIN FONDO, Y CON NEGRO A OPACIDAD
    ================================
    El fondo lo pone la ranura, con surface-container-high. Y la figura
    lleva negro con opacidad, no un gris: con un gris fijo habria que elegir
    tema y el otro quedaria mal, y al 10 o al 14 por ciento es contraste
    relativo, el mismo valor en los dos temas. Medido en el fichero hermano.
  -->
  <rect x="96" y="80" width="48" height="8" rx="4" fill="#000" fill-opacity="0.10"/>
  <rect x="76" y="112" width="88" height="96" rx="12" fill="#000" fill-opacity="0.14"/>
</svg>
