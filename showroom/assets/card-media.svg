<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180"
     role="img" aria-label="Imagen de ejemplo">
  <!--
    Asset de imagen del showroom.

    Las rayas de este comentario son puntos, y NUNCA dos guiones seguidos: un
    comentario XML no los admite. Todo prefijo de token del sistema empieza
    por dos guiones, asi que escribir uno aqui dentro, o un separador de
    guiones, deja el fichero invalido y el navegador lo tira entero sin
    avisar. Pasa dos veces en este mismo fichero, y las dos veces la senal
    fue la misma: naturalWidth a 0 y la ranura a 20px de alto.

    POR QUE SVG Y NO PNG
    ====================
    Es texto. Un PNG binario en un repo cuyo .gitattributes y cuyas reglas
    tratan todo como texto UTF-8 introduce un segundo tipo de fichero que
    nadie revisa en un diff, y no se puede buscar dentro. Un SVG se versiona,
    se lee en el commit y se puede corregir sin herramienta.

    QUE DIBUJA: NADA EN CONCRETO, A PROPOSITO
    =========================================
    Un bloque gris en el centro. Sin producto, sin marca, sin texto.

    La primera version dibujaba una ficha de producto con su caja y su
    referencia, y era un error: la ranura .md-card-media no lee el contenido
    de la imagen, solo la recorta. Poner un producto al inventar convertia un
    placeholder en una mentira, porque cualquiera que copiara el snippet se
    llevaria tambien el "Caja de Carthago". Un bloque neutro no inventa nada.

    Y por el mismo motivo el texto de la card es el NOMBRE DEL ROL y no un
    contenido de ejemplo: "Title", "Subhead", "Body". Es lo que ya hace
    typography.html con sus specimens.

    SIN FONDO, Y CON OPACIDAD, POR EL TEMA OSCURO
    =============================================
    Este fichero llevaba el fondo escrito en hexadecimal, y en tema oscuro se
    quedaba claro: la card se ponia oscura y el bloque seguia siendo el
    mismo gris claro.

    Un elemento img no puede leer las variables CSS de la pagina, asi que un
    color de tema dentro del SVG no es posible. Lo que si funciona es dejar
    el fondo TRANSPARENTE y que lo ponga la ranura .md-card-media, que si lee
    un rol de color de la capa 2, y ese si cambia con el tema.

    Y la figura lleva NEGRO CON OPACIDAD, no un gris. Con un gris fijo habria
    que elegir el claro o el oscuro y el otro quedaria mal. Con negro al 14%
    sobre fondo claro se ve mas oscuro, y sobre fondo oscuro se ve mas claro:
    es contraste relativo, y el mismo valor sirve en los dos temas. Medido.
  -->
  <rect x="120" y="50" width="80" height="80" rx="12" fill="#000" fill-opacity="0.14"/>
</svg>
