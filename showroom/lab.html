<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab — RDM ManGo! App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">
  <link rel="stylesheet" href="../src/css/main.css?v=77">
  <script type="module" src="../src/js/main.js"></script>
  <script src="assets/showroom.js"></script>
</head>
<body class="md-bg-background md-text-on-background md-type-body-medium">

<div class="md-scaffold">
  <!-- Slot: Cuerpo de paneles de Scaffold -->
  <div class="md-scaffold-body">
    <!-- Slot: Pane fijo con carga inicial (Default uncontained) -->
    <section class="md-scaffold-pane md-scaffold-pane-fixed" data-loading="initial" data-loading-label="Cargando panel" aria-label="Panel fijo">
      <article class="md-card md-card-outlined">
        <div class="md-card-content">
          <p class="md-type-title-medium">Contenido</p>
          <p class="md-type-body-small">Atenuado durante la carga inicial.</p>
        </div>
      </article>
    </section>
    <!-- Slot: Pane flexible en recarga (Contained con velo de superficie) -->
    <section class="md-scaffold-pane md-scaffold-pane-flexible" data-loading="refresh" data-loading-label="Actualizando panel" aria-label="Panel flexible">
      <article class="md-card md-card-outlined">
        <div class="md-card-content">
          <p class="md-type-title-medium">Panel en recarga</p>
          <p class="md-type-body-small">Contenido visible protegido bajo el velo translucido de superficie.</p>
        </div>
      </article>
    </section>
  </div>
</div>



  <!-- Botón conmutador de tema -->
  <button type="button" class="md-icon-button" data-theme-toggle aria-label="Tema del sistema activo">
    <span class="md-icon" aria-hidden="true">brightness_auto</span>
  </button>






</body>
</html>
