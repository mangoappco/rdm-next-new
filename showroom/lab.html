<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Lab — RDM ManGo! App</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">
   <link rel="stylesheet" href="../src/css/main.css">
   <script type="module" src="../src/js/main.js"></script>
</head>
<body class="md-bg-background md-text-on-background md-type-body-medium">



  <main>







 <nav class="md-navigation-rail" role="tablist" aria-label="Navegación con menú, acción principal y notificaciones">
  <!-- Slot: Cabecera y controles maestros -->
  <div class="md-navigation-rail-header">
    <button type="button" class="md-icon-button" aria-label="Abrir menú de navegación" data-rail-toggle>
      <span class="md-icon" aria-hidden="true">menu</span>
    </button>
    <button type="button" class="md-fab md-fab-primary md-fab-extended">
      <span class="md-icon" aria-hidden="true">edit</span>Crear<span class="md-fab-touch"></span>
    </button>
  </div>
  <!-- Slot: Lista de destinos de navegación -->
  <div class="md-navigation-rail-content">
    <button type="button" class="md-navigation-rail-item" role="tab" aria-selected="true" tabindex="0">
      <!-- Slot: Icono / Indicador -->
      <span class="md-navigation-rail-indicator">
        <span class="md-navigation-rail-icon md-icon" aria-hidden="true">home</span>
      </span>
      <!-- Slot: Etiqueta de texto -->
      <span class="md-navigation-rail-label">Inicio</span>
    </button>
    <button type="button" class="md-navigation-rail-item" role="tab" aria-selected="false" aria-label="Alertas, novedades pendientes" tabindex="-1">
      <!-- Slot: Icono / Indicador con Badge -->
      <span class="md-navigation-rail-indicator">
        <span class="md-badge-anchor">
          <span class="md-navigation-rail-icon md-icon" aria-hidden="true">notifications</span>
          <span class="md-badge md-badge-small" aria-hidden="true"></span>
        </span>
      </span>
      <!-- Slot: Etiqueta de texto -->
      <span class="md-navigation-rail-label">Alertas</span>
    </button>
    <button type="button" class="md-navigation-rail-item" role="tab" aria-selected="false" aria-label="Mensajes, 3 sin leer" tabindex="-1">
      <!-- Slot: Icono / Indicador con Badge -->
      <span class="md-navigation-rail-indicator">
        <span class="md-badge-anchor">
          <span class="md-navigation-rail-icon md-icon" aria-hidden="true">mail</span>
          <span class="md-badge md-badge-large" aria-hidden="true">3</span>
        </span>
      </span>
      <!-- Slot: Etiqueta de texto -->
      <span class="md-navigation-rail-label">Mensajes</span>
    </button>
    <button type="button" class="md-navigation-rail-item" role="tab" aria-selected="false" aria-label="Historial, 12 pedidos" tabindex="-1">
      <!-- Slot: Icono / Indicador con Badge -->
      <span class="md-navigation-rail-indicator">
        <span class="md-badge-anchor">
          <span class="md-navigation-rail-icon md-icon" aria-hidden="true">history</span>
          <span class="md-badge md-badge-large" aria-hidden="true">12</span>
        </span>
      </span>
      <!-- Slot: Etiqueta de texto -->
      <span class="md-navigation-rail-label">Historial</span>
    </button>
  </div>
</nav>







  </main>




</body>
</html>
