<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab — RDM ManGo! App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">
  <link rel="stylesheet" href="../src/css/main.css">
  <script type="module" src="../src/js/main.js"></script>
</head>

<body class="md-bg-primary-container md-text-on-background md-type-body-medium">

  <!-- ==================================================================== -->
  <!-- 1. PRUEBA SCROLLED STATE (Par 1 Small con data-md-top-app-bar-scroll) -->
  <!-- ==================================================================== -->
  <header class="md-top-app-bar md-top-app-bar-contextual" role="banner">
  <div class="md-top-app-bar-leading">
    <button type="button" class="md-icon-button" data-md-selection-clear aria-label="Cerrar selección">
      <span class="md-icon" aria-hidden="true">close</span>
    </button>
  </div>
  <div class="md-top-app-bar-content">
    <span class="md-top-app-bar-title">3 seleccionados</span>
  </div>
  <div class="md-top-app-bar-trailing">
    <button type="button" class="md-icon-button" aria-label="Eliminar elementos seleccionados">
      <span class="md-icon" aria-hidden="true">delete</span>
    </button>
    <button type="button" class="md-icon-button" aria-label="Compartir selección">
      <span class="md-icon" aria-hidden="true">share</span>
    </button>
    <button type="button" class="md-icon-button" aria-label="Más opciones">
      <span class="md-icon" aria-hidden="true">more_vert</span>
    </button>
  </div>
</header>

  <main>





    <!-- Relleno de altura para activar el scroll real del navegador -->
    <div class="lab-spacer">Fila de contenido 1</div>
    <div class="lab-spacer">Fila de contenido 2</div>
    <div class="lab-spacer">Fila de contenido 3</div>
    <div class="lab-spacer">Fila de contenido 4</div>
    <div class="lab-spacer">Fila de contenido 5</div>
    <div class="lab-spacer">Fila de contenido 6</div>

    <button type="button" class="md-button md-button-tonal" data-md-theme-toggle>
      <span class="md-button-label">Tema: sistema</span>
    </button>

  </main>
</body>
</html>
