<body class="md-bg-background md-text-on-background md-type-body-medium">



<div class="md-scaffold">

    <!-- Slot obligatorio: Panel principal flexible -->

      <article class="md-card md-card-elevated">

  <div class="md-card-media md-card-media-landscape">

  </div>

  <!-- Slot: Header / Titular y subtítulo -->
  <div class="md-card-header">
    <h3 class="md-type-title-large">Headline</h3>
    <p class="md-type-body-medium">Subhead</p>
  </div>

  <!-- Slot: Content / Cuerpo y texto de apoyo -->
  <div class="md-card-content">
    <p class="md-type-body-medium">Supporting text</p>
  </div>

  <!-- Slot: Actions / Botones y controles -->
  <div class="md-card-actions">
    <button class="md-button md-button-text" type="button">Action</button>
    <button class="md-button md-button-filled" type="button">Primary</button>
  </div>
</article>
