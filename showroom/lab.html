<!--
  LABORATORIO: página de pruebas del cuaderno, versionada desde el
  2026-10-26 (sin specimens ni snippets que el verificador compare); sí
  viaja en el repo, pero no es parte del catálogo. Consume UNICAMENTE
  main.css y main.js: lo que aquí rinda, rinde en ManGo! App.

  Con main.js se puede comprobar también lo que el CSS no dice: un snippet
  con `data-toggle` o con un `<dialog>` necesita el comportamiento, y aquí
  se ve si funciona o si depende de algo que no se distribuye.

  Dinámica: pegar el snippet bajo ZONA DE PRUEBAS, recargar, mirar y medir
  en DevTools. Nada de estilos ni clases sr-*: si algo no se ve aquí, el
  snippet depende del chrome y hay que corregirlo, no la página.
-->
