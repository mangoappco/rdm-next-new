<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab — RDM ManGo! App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">
  <link rel="stylesheet" href="../src/css/main.css">
  <script type="module" src="../src/js/main.js"></script>
</head>

<body class="md-bg-background md-text-on-background md-type-body-medium">


  <header class="md-app-header" data-md-top-app-bar-scroll role="banner">
    <div class="md-top-app-bar md-top-app-bar-small">
      <div class="md-top-app-bar-leading">
        <button type="button" class="md-icon-button" aria-label="Abrir menú principal">
          <span class="md-icon" aria-hidden="true">menu</span>
        </button>
      </div>
      <div class="md-top-app-bar-content">
        <span class="md-top-app-bar-title">Gestión de mesas</span>
      </div>
      <div class="md-top-app-bar-trailing">
        <button type="button" class="md-icon-button" aria-label="Buscar mesa">
          <span class="md-icon" aria-hidden="true">search</span>
        </button>
        <button type="button" class="md-icon-button" aria-label="Más opciones">
          <span class="md-icon" aria-hidden="true">more_vert</span>
        </button>
      </div>
    </div>
    <div class="md-tabs md-tabs-primary" role="tablist" aria-label="Filtro de mesas">
      <button type="button" class="md-tab" role="tab" aria-selected="true" tabindex="0">
        <span class="md-tab-label">Todas</span>
      </button>
      <button type="button" class="md-tab" role="tab" aria-selected="false" tabindex="-1">
        <span class="md-tab-label">Ocupadas</span>
      </button>
      <button type="button" class="md-tab" role="tab" aria-selected="false" tabindex="-1">
        <span class="md-tab-label">Disponibles</span>
      </button>
      <button type="button" class="md-tab" role="tab" aria-selected="false" tabindex="-1">
        <span class="md-tab-label">Por cobrar</span>
      </button>
    </div>
  </header>









  <main>


    <button type="button" class="md-fab md-fab-extended md-fab-anchored" data-md-theme-toggle>
      <span class="md-button-label">Tema: sistema</span>
    </button>




    <p class="md-type-display-large">Display large</p>
    <p class="md-type-display-large">Display large</p>
    <p class="md-type-display-large">Display large</p>
    <p class="md-type-display-large">Display large</p>
    <p class="md-type-display-large">Display large</p>
    <p class="md-type-display-large">Display large</p>
    <p class="md-type-display-large">Display large</p>
    <p class="md-type-display-large">Display large</p>

    <p class="md-type-display-large">Display large</p>












  </main>



</body>
</html>
