<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Lab — RDM ManGo! App</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">
   <link rel="stylesheet" href="../src/css/main.css">
   <script type="module" src="../src/js/main.js"></script>
</head>
<body class="md-bg-background md-bg-surface-container-highest md-text-on-background md-type-body-medium">

  <header class="md-app-header " data-md-top-app-bar-scroll role="banner">
    <div class="md-top-app-bar md-top-app-bar-large" data-md-top-app-bar-collapse>
      <div class="md-top-app-bar-leading">
        <button type="button" class="md-icon-button" aria-label="Abrir menú principal">
          <span class="md-icon" aria-hidden="true">menu</span>
        </button>
      </div>
      <div class="md-top-app-bar-content">
        <span class="md-top-app-bar-title">Gestión de mesas</span>
      </div>
      <div class="md-top-app-bar-trailing">
        <button type="button" class="md-icon-button" aria-label="Buscar mesa">
          <span class="md-icon" aria-hidden="true">search</span>
        </button>
        <button type="button" class="md-icon-button" aria-label="Más opciones">
          <span class="md-icon" aria-hidden="true">more_vert</span>
        </button>
      </div>
    </div>

  </header>

  <main>




    <nav class="md-navigation-rail md-navigation-rail-expanded" role="tablist" aria-label="Navegación extendida con menú y acción principal">
  <div class="md-navigation-rail-header">
    <button type="button" class="md-icon-button" aria-label="Contraer menú de navegación" aria-expanded="true" data-rail-toggle>
      <span class="md-icon" aria-hidden="true">menu_open</span>
    </button>
    <button type="button" class="md-fab md-fab-extended">
      <span class="md-icon" aria-hidden="true">edit</span>Crear<span class="md-fab-touch"></span>
    </button>
  </div>

  <div class="md-navigation-rail-content">
    <button type="button" class="md-navigation-rail-item" role="tab" aria-selected="true" tabindex="0">
      <span class="md-navigation-rail-indicator">
        <span class="md-navigation-rail-icon md-icon" aria-hidden="true">star</span>
      </span>
      <span class="md-navigation-rail-label">Destacados</span>
    </button>
    <button type="button" class="md-navigation-rail-item" role="tab" aria-selected="false" tabindex="-1">
      <span class="md-navigation-rail-indicator">
        <span class="md-navigation-rail-icon md-icon" aria-hidden="true">star</span>
      </span>
      <span class="md-navigation-rail-label">Favoritos</span>
    </button>
    <button type="button" class="md-navigation-rail-item" role="tab" aria-selected="false" tabindex="-1">
      <span class="md-navigation-rail-indicator">
        <span class="md-navigation-rail-icon md-icon" aria-hidden="true">star</span>
      </span>
      <span class="md-navigation-rail-label">Historial</span>
    </button>
  </div>
</nav>




  </main>




</body>
</html>
