<head>

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">

<body class="md-bg-background md-text-on-background md-type-body-medium">





  <main>





<div class="md-menu-anchor">
  <!-- Slot: Disparador interactivo -->
  <button type="button" class="md-icon-button" id="menu-trigger-interactive" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-interactive" aria-label="Acciones interactivas de comanda">
    <span class="md-icon" aria-hidden="true">more_vert</span>
  </button>
  <!-- Slot: Superficie flotante interactiva (se despliega con clic/teclado) -->
  <div class="md-menu" id="menu-interactive" role="menu" aria-labelledby="menu-trigger-interactive">
    <button type="button" class="md-menu-item" role="menuitem">
      <!-- Slot: Leading -->
      <span class="md-menu-item-leading md-icon" aria-hidden="true">visibility</span>
      <!-- Slot: Content -->
      <span class="md-menu-item-headline">Ver comanda</span>
    </button>
    <button type="button" class="md-menu-item" role="menuitem">
      <!-- Slot: Leading -->
      <span class="md-menu-item-leading md-icon" aria-hidden="true">print</span>
      <!-- Slot: Content -->
      <span class="md-menu-item-headline">Reimprimir</span>
      <!-- Slot: Trailing -->
      <span class="md-menu-item-trailing">Ctrl+P</span>
    </button>
    <!-- Separador canónico M3 -->
    <hr class="md-divider" role="separator">
    <button type="button" class="md-menu-item md-menu-item-destructive" role="menuitem">
      <!-- Slot: Leading -->
      <span class="md-menu-item-leading md-icon" aria-hidden="true">delete</span>
      <!-- Slot: Content -->
      <span class="md-menu-item-headline">Cancelar</span>
    </button>
  </div>
</div>







  </main>




</body>
