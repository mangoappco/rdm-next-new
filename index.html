<!DOCTYPE html>
<!-- ==========================================================================
     RDM Next — Showroom de componentes
     ==========================================================================

     SHELL DEL SHOWROOM.

     Este archivo existe para dos cosas:

       1. Cargar el sistema completo (css/main.css) y la fuente.
       2. Servir de esqueleto donde luego se inserten los componentes.

     ---------------------------------------------------------------------------
     REGLA DE DOGFOODING (NO NEGOCIABLE)
     ---------------------------------------------------------------------------
     CERO estilos inline. Ni un solo atributo de estilo en el cuerpo del HTML.

     El showroom se construye UNICAMENTE con lo que el sistema proporciona:

       2-sys/  clases de utilidad semanticas
               .md-type-*   tipografia  (typography.css)
               .md-bg-*     fondos     (colors.css)
               .md-text-*   texto      (colors.css)

       3-comp/  componentes M3, a medida que se liberen

     REGLA DE PRUEBA DEL SISTEMA
     ---------------------------
     Si al maquetar hace falta un margen, un padding o un color que no existe,
     NO se resuelve inline. Se evalua si corresponde crear el token semantico
     o la utilidad en 2-sys o 3-comp, siguiendo el flujo del proyecto.

     Ese es el proposito del showroom: encontrar los huecos del sistema
     mientras se maqueta, no taparlos con parches.

     VERIFICACION: tools/verify-tokens.ps1, REGLA 6, falla si aparece un
     atributo de estilo en cualquier HTML del showroom.

     ========================================================================== -->
<html lang="es" data-theme="light">
<!-- data-theme="light" fija un estado inicial INDEPENDIENTE del sistema
     operativo del visitante. Sin este atributo, el tema se resuelve por
     prefers-color-scheme y el showroom se veria oscuro en una maquina con
     SO oscuro, que no es lo esperado al abrir la referencia visual.

     El toggle de ManGo! App funciona cambiando este atributo:
     document.documentElement.setAttribute('data-theme', 'dark') -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RDM Next — Showroom</title>
  <meta name="description" content="Showroom de componentes UI de ManGo! App, construido sobre Material Design 3.">

  <!-- ==========================================================================
       CARGA DE LA FUENTE
       --------------------------------------------------------------------------
       Google Sans Flex se carga con <link>, y no dentro del CSS. Motivo
       tecnico: un @import de CSS bloquea el descubrimiento de los recursos
       posteriores. Para una fuente es el peor caso: nada se puede pintar
       hasta que la fuente este descargada.

       Las tres lineas hacen esto:
         1. preconnect a fonts.googleapis.com  -> evita un round-trip de DNS
         2. preconnect a fonts.gstatic.com     -> idem, y con crossorigin
         3. el stylesheet de la fuente         -> se descarga en paralelo

       POR QUE LA URL NO DECLARA :wght
       ---------------------------------
       Seria tentador escribir `family=Google+Sans+Flex:wght@400;500;700`. No
       se hace a proposito, y el motivo es el peso de la descarga:

         con :wght   ->  Google responde con un TTF por peso: 3 peticiones,
                         del orden de 100-200 KB cada una
         sin :wght   ->  Google sirve el archivo VARIABLE en woff2: 1 peticion,
                         del orden de 30-60 KB, que cubre todos los pesos

       Entre dos y tres veces mas ligero. Y como Google Sans Flex es variable,
       servir el archivo completo es ademas lo que mas aprovecha el diseno.

       El parametro `display=swap` hace que el navegador pinte el texto con una
       fuente provisional mientras descarga la definitiva, en lugar de mostrar
       texto invisible. Esa fuente provisional sale del stack declarado en
       css/1-ref/typeface.css, que empieza por las fuentes del sistema.

       El fallback para usar el archivo de forma aislada esta comentado en
       css/1-ref/typeface.css, con la explicacion del trade-off.
       ========================================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap">

  <!-- ==========================================================================
       EL SISTEMA DE TOKENS
       --------------------------------------------------------------------------
       Un solo archivo. Nunca los individuales: main.css garantiza que toda la
       cadena de 19 hojas se cargue en el orden correcto, con las capas
       @layer ya declaradas.

       Si se importara 3-comp/button.css sin main.css, sus variables no
       existiran y el componente se veria roto.
       ========================================================================== -->
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <!-- ====================================================================== -->
  <!-- INICIO: SHOWROOM - PLACEHOLDER                                         -->
  <!-- ------------------------------------------------------------------------
       El showroom esta en construccion. Este placeholder existe para
       comprobar que la cadena del sistema funciona de extremo a extremo:

         1-ref  ->  2-sys  ->  utilidad de clase  ->  HTML

       Usa unicamente clases de 2-sys. Sin estilos inline.

       Cuando se libere el primer componente de 3-comp/, este bloque se
       sustituye por la seccion interactiva del componente, conservando el
       formato de comentarios delimitadores que exige el proyecto.
       ====================================================================== -->

  <main>

    <header>
      <h1 class="md-type-headline-medium md-text-primary">
        RDM Next
      </h1>
    </header>

    <section>
      <p class="md-type-body-large md-text-on-surface-variant">
        Sistema de tokens completo. Componentes en camino.
      </p>
    </section>

  </main>

  <!-- ====================================================================== -->
  <!-- FIN: SHOWROOM - PLACEHOLDER                                            -->
  <!-- ====================================================================== -->

</body>
</html>
