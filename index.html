<!DOCTYPE html>
<!-- ==========================================================================
     RDM Next — Showroom de componentes
     ==========================================================================

     PORTADA DEL SHOWROOM

     Este archivo es la puerta de entrada. No contiene secciones de
     componentes: solo el titulo, la tagline y los enlaces a las vistas.

     Cada componente tiene su propia vista:

       divider.html    el separador de M3

     Cuando se construyan mas componentes, se anaden aqui sus enlaces.

     ---------------------------------------------------------------------------
     ARQUITECTURA DE VISTAS
     ---------------------------------------------------------------------------
     index.html      portada: titulo, tagline, enlaces
     <component>.html  una vista por componente en 3-comp/

     Las vistas cargan el sistema completo (css/main.css) y la fuente, igual
     que este archivo.

     ---------------------------------------------------------------------------
     DOGFOODING
     ---------------------------------------------------------------------------
     Cero estilos en linea. Ni un atributo de estilo en el cuerpo del HTML,
     ni un bloque de estilos propio.

     El showroom se construye UNICAMENTE con lo que el sistema proporciona:

       reset.css  la base que el navegador no puede imponer

       2-sys/  clases de utilidad semanticas
               .md-type-*   tipografia  (typography.css)
               .md-bg-*     fondos     (colors.css)
               .md-text-*   texto      (colors.css)
               .md-border-* bordes     (colors.css)
               .md-shape-*  esquinas   (shape.css)
               .md-measure-* medidas   (measurement.css)

       3-comp/  componentes M3, a medida que se liberen

       LAS MEDIDAS NO SON UNA EXCEPCION
       ---------------------------------
       Las medidas se consumen igual que la tipografia y el color: con clases
       de 2-sys, aplicadas sobre las etiquetas semanticas.

       No hay utilidades de layout, ni atajos, ni clases de "box". La medida
       es una familia de tokens mas, con el mismo criterio que las demas.

       Por que .md-measure-section-gap NO usa la propiedad gap: gap solo
       funciona en contenedores flex o grid, y un <section> es block. Medido
       en el motor: gap de 40px en un bloque block separa 0px. Estas clases
       usan margin-block, que funciona en cualquier modo de layout. Ver la
       cabecera de 2-sys/measurement.css.

     ---------------------------------------------------------------------------
     REGLA DE PRUEBA DEL SISTEMA
     ---------------------------------------------------------------------------
     Si al maquetar hace falta un margen, un padding o un color que no existe,
     NO se resuelve en linea. Se evalua si corresponde crear el token semantico
     o la utilidad en 2-sys o 3-comp, siguiendo el flujo del proyecto.

     Ese es el proposito del showroom: encontrar los huecos del sistema
     mientras se maqueta, no taparlos con parches.

     VERIFICACION: tools/verify-tokens.ps1, REGLA 6, falla si aparece un
     atributo de estilo o un bloque de estilos en cualquier HTML del proyecto.

     ---------------------------------------------------------------------------
     NOTA SOBRE EL NOMBRADO DE LAS CLASES
     ---------------------------------------------------------------------------
     Las utilidades usan PROPIEDAD PRIMERO: `md-bg-surface`, no `md-color-surface`.
     El nombre dice que propiedad modifica, y asi se lee en el HTML sin
     tener que llegar al final de la clase. Es el criterio de Tailwind.

     Las utilidades de tipografia usan el prefijo corto `md-type-*`. Google usa
     `typescale` para esa familia, pero el prefijo corto se mantiene por
     legibilidad en el marcado.

     ========================================================================== -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ManGo! App — RDM Next</title>
  <meta name="description" content="Showroom de componentes UI de ManGo! App, construido sobre Material Design 3.">

  <!-- ==========================================================================
       CARGA DE LA FUENTE
       --------------------------------------------------------------------------
       Google Sans Flex se carga con <link>, y no dentro del CSS. Motivo
       tecnico: un @import de CSS bloquea el descubrimiento de los recursos
       posteriores. Para una fuente es el peor caso: nada se puede pintar
       hasta que la fuente este descargada.

       Las tres lineas hacen esto:
         1. preconnect a fonts.googleapis.com  -> evita un round-trip de DNS
         2. preconnect a fonts.gstatic.com     -> idem, y con crossorigin
         3. el stylesheet de la fuente         -> se descarga en paralelo
       ========================================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex&display=swap" rel="stylesheet">

  <!-- ==========================================================================
       EL SISTEMA DE TOKENS
       --------------------------------------------------------------------------
       Un solo archivo. Nunca los individuales: main.css garantiza que toda la
       cadena de 21 hojas se cargue en el orden correcto, con las capas
       @layer ya declaradas.
       ========================================================================== -->
  <link rel="stylesheet" href="./css/main.css">
</head>

<body class="md-bg-background md-text-on-background md-type-body-medium">
  <!-- ========================================================================
       LA BASE DE LA VISTA, CON LA SEMANTICA DE M3
       ------------------------------------------------------------------------
       Las tres clases van en el <body>, no en un contenedor interior, por dos
       razones que son la misma:

         1. EL <body> ES EL LIENZO. El reset ya le da min-height: 100vh, asi que
            su fondo cubre la ventana entera. En un <div> interior, un documento
            corto dejaba la banda de abajo sin pintar: blanca en tema oscuro,
            con el color del sistema y no con el del tema.

         2. M3 RESERVA `background` PARA LA PAGINA. El rol `background` es el
            fondo del lienzo; `surface` es el fondo de una superficie concreta
            (una tarjeta, un menu, un dialogo). Una pagina no es una superficie:
            es el fondo. Por eso el fondo usa `md-bg-background` y su contenido
            se lee con `md-text-on-background`, que es el par que garantiza
            contraste segun la propia especificacion de M3.

       El par se escribe EXPLICITO, porque 2-sys/colors.css no ofrece ningun
       atajo que empareje fondo con su texto. Esa decision es lo que hace
       auditable el contraste: se lee en el marcado, sin abrir la hoja de
       estilo.

       El texto de apoyo usa `md-text-on-surface-variant`: es el rol de menor
       enfasis que define M3, y no existe un `on-background-variant`.
       ======================================================================== -->

  <header class="md-measure-page-margin">
    <h1 class="md-type-display-medium md-text-primary">
      RDM Next
    </h1>
    <p class="md-type-title-medium md-text-on-surface-variant">
      Sistema de tokens completo. Componentes en desarrollo
    </p>
  </header>

  <nav class="md-measure-page-margin">
    <p class="md-type-label-large md-text-on-surface-variant">
      Componentes:
      <a href="./divider.html" class="md-text-primary">Divider</a>
    </p>
  </nav>

</body>
</html>
